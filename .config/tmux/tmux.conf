#
# ~/.config/tmux/tmux.conf
#
# tmux configuration (XDG layout)
# - This file is intended to be portable across macOS / Linux (Wayland/X11) / SSH.
# - Keep external commands minimal where possible.
#

# ============================================================
# Prefix key
# ------------------------------------------------------------
# Use Ctrl-t as the tmux prefix (instead of the default Ctrl-b).
# ============================================================

unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ============================================================
# Key bindings
# ============================================================

# Create a new window
unbind c
bind c new-window

# Next window (Space)
unbind " "
bind " " next-window

# Kill the current window (with confirmation)
bind k confirm-before -p "kill-window? (y/n)" kill-window

# Split the current pane (new pane starts in the current directory)
#   |  : side by side (left / right)
#   -  : stacked (top / bottom)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move to the next pane (same as the tmux default, kept explicit)
bind o select-pane -t :.+

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded ~/.config/tmux/tmux.conf"

# ============================================================
# UI / Status line
# ------------------------------------------------------------
# Minimal, high-contrast status line.
# (Prefer *-style options over deprecated status-bg/status-fg.)
# ============================================================

set -g status-interval 1

set -g status-style "bg=green,fg=black"
set -g status-left-length 100
set -g status-right-length 120

# ------------------------------------------------------------
# Format reference for status-left / status-right
# ------------------------------------------------------------
# #S                     → session name
# #I                     → window index
# #P                     → pane index
# #{pane_current_command}→ current command in pane
# #{pane_current_path}   → current working directory
# #{user}                → username
# #{host_short}          → short hostname
# %Y-%m-%d %H:%M         → date/time (strftime format)
#
# Styling syntax:
#   #[fg=color]          → foreground color
#   #[bg=color]          → background color
#   #[bold]              → bold text
#   #[dim]               → dim text
#   #[default]           → reset style
#
# Conditional syntax:
#   #{?condition,then,else}
#
# External command syntax:
#   #(command)
# ------------------------------------------------------------

# Left: session:window.pane command
set -g status-left "\
#[bold,bg=blue,fg=white] #S\
#[dim]:#I.#P \
#[nodim]#{?pane_in_mode,#[fg=yellow]COPY #[default] ,}\
#{pane_current_command} \
#[default] \
"

# Right: user@host | datetime
set -g status-right "\
#[bg=colour246,fg=black] #{user}@#{host_short} | \
%Y-%m-%d %H:%M \
#[default]\
"

# ============================================================
# General options
# ============================================================

# Use tmux-specific terminfo
set -g default-terminal "tmux-256color"

# Enable truecolor
set -as terminal-features ',*:RGB'

# History
set -g history-limit 50000

# Use vi-style keybindings in copy mode
set -g mode-keys vi

# Prevent applications from renaming tmux windows automatically
set -g allow-rename off
set -g automatic-rename off

# Enable mouse support (scroll, select panes, resize, etc.)
set -g mouse on

# ============================================================
# Environment propagation
# ------------------------------------------------------------
# Ensure tmux inherits important environment variables
# from the GUI/login shell (Wayland/X11, SSH agent, etc.)
# ============================================================

set -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK XAUTHORITY"

# ============================================================
# Clipboard integration (copy-mode-vi)
# ------------------------------------------------------------
# Every copy in tmux (mouse drag, y, Enter) goes to a tmux
# buffer, and `set-clipboard on` makes tmux also send the text
# to the outer terminal via OSC 52. The terminal then writes it
# to the system clipboard — this works even over SSH, because
# the escape sequence travels back through the tty to the
# terminal running locally (wezterm supports OSC 52).
#
# No external copy command (wl-copy / xclip / pbcopy) is needed:
# those only work where a display server is reachable, while
# OSC 52 covers local and remote sessions alike.
#
# The default `external` would cover tmux's own copies; `on`
# additionally lets applications inside tmux (vim, etc.) set
# the clipboard with their own OSC 52 sequences.
#
# Known limitation: the Linux console (VT) supports neither
# OSC 52 nor a system clipboard — only tmux-internal paste
# (prefix + ]) works there.
# ============================================================

set -g set-clipboard on

# Start selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Toggle rectangle selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy selection to clipboard (y / Enter)
bind-key -T copy-mode-vi y     send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# ============================================================
# TPM (Tmux Plugin Manager)
# ------------------------------------------------------------
# Prefix + I  : install plugins
# Prefix + U  : update plugins
# Prefix + Alt-u : remove plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore sessions on tmux start
set -g @continuum-restore 'on'

# ============================================================
# tmux-resurrect / tmux-continuum tuning
# ------------------------------------------------------------
# continuum:
#   - saves tmux environment periodically
#   - can restore sessions automatically on tmux start
#
# resurrect:
#   - saves/restores tmux sessions (windows/panes/layouts)
#   - optionally captures pane contents
# ============================================================

# Continuum: save every N minutes (default is 15 in many setups, but set explicitly)
set -g @continuum-save-interval '15'

# Resurrect: also save/restore pane contents (useful when you want context back)
# NOTE: This may increase save file size.
set -g @resurrect-capture-pane-contents 'on'

# Resurrect: restore Vim sessions (if you use vim/nvim inside tmux)
# NOTE: Requires vim to be present and may rely on your vim session settings.
set -g @resurrect-strategy-vim 'session'

# Resurrect: restore Neovim sessions as well (safe even if you don't use nvim)
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this at the very bottom of the file)
run '~/.config/tmux/plugins/tpm/tpm'
